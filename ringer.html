<script>
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyzCTs1LrCIee78Ykm0ebUoE1Vf4o2Ew1HNHrFY7fUsImz7vnVLKPqGxjV8Hq-pgBN1Iw/exec';
var SEASON='2026';var ADMIN_PW='roxy2026';

var DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
// Current course handicaps as of 8/31/2026 — one-time update for final round
var HDCP_OVERRIDES={'Kevin Powers':7,'Chris Fox':17,'John McFadden':23,'John Gallagher':17,'Rich Goldman':13,'Ralph Leporace':14,'Tony Rubino':12,'Dan Ostien':13,'Robert Loewen':8,'Robert Sweigart':12,'Jerry Vergilis':17,'Don Zabinski':15,'Dennis Reilly':16,'Bob Mairone':5,'Kevin Kennedy':16,'Matt Manders':11,'Keith Biers':11,'Paul Haviland':15,'Anthony Marino':14,'Pete Westhead':10};
var allHistory=[],ringerConfig=null,adminUnlocked=false;var adminDays={},adminPlayers=[],adminSelected={};var playerRoundData={};
function initials(n){return n.split(' ').map(function(p){return p[0]}).join('').toUpperCase().slice(0,2)}
function showAdminLogin(){document.getElementById('admin-login').style.display='inline';document.getElementById('admin-toggle-btn').style.display='none'}
function adminLogin(){if(document.getElementById('admin-pw').value!==ADMIN_PW){document.getElementById('admin-login').innerHTML='<span style="color:#c0392b;font-size:12px">Wrong password</span>';return}adminUnlocked=true;document.getElementById('admin-gate').style.display='none';document.getElementById('admin-panel').style.display='block';buildAdminUI()}
function buildAdminUI(){var nameSet={};if(ringerConfig&&ringerConfig.players)ringerConfig.players.forEach(function(n){nameSet[n]=true});allHistory.forEach(function(e){if(e.scores)Object.keys(e.scores).forEach(function(n){nameSet[n]=true})});adminPlayers=Object.keys(nameSet).sort();adminSelected={};adminPlayers.forEach(function(n){adminSelected[n]=ringerConfig&&ringerConfig.players?ringerConfig.players.indexOf(n)!==-1:false});var h='<div class="card"><div class="card-header"><span>Ringer Tournament Setup</span><button class="btn-sm btn-apply" onclick="saveConfig()">Save Config</button></div><div class="card-body">';h+='<div style="margin-bottom:16px"><div class="filter-label">Qualifying Days</div><div class="filter-chips" id="admin-day-chips">';for(var d=0;d<7;d++){var isA=ringerConfig&&ringerConfig.days?ringerConfig.days.indexOf(d)!==-1:d===5;adminDays[d]=isA;h+='<div class="chip'+(isA?' active':'')+'" id="ad-'+d+'" onclick="toggleAdminDay('+d+')">'+DAY_NAMES[d]+'</div>'}h+='</div></div>';h+='<div style="margin-bottom:12px"><div class="filter-label">Tournament Roster <span id="admin-player-count" style="font-weight:400;text-transform:none;letter-spacing:0"></span></div>';h+='<div class="filter-chips" id="admin-player-chips"></div>';h+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn-sm" onclick="adminSelectAll()">Select all</button><button class="btn-sm" onclick="adminDeselectAll()">Clear</button></div></div>';h+='<div style="margin-bottom:12px"><div class="filter-label">Add new player</div><div style="display:flex;gap:6px"><input type="text" id="new-player-name" placeholder="Full name" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1" /><button class="btn-sm btn-apply" onclick="addNewPlayer()">Add</button></div></div>';h+='<div id="admin-msg"></div></div></div>';h+='<div class="card"><div class="card-header"><span>Refresh Handicaps</span></div><div class="card-body">';h+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Paste a Squabbit CSV to update course handicaps for the Net ringer without saving a full round.</div>';if(ringerConfig&&ringerConfig.hdcps){var hNames=Object.keys(ringerConfig.hdcps).sort();h+='<div class="alert-ok" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span>✓ Handicap overrides active — '+hNames.length+' players'+(ringerConfig.hdcpDate?' · updated '+ringerConfig.hdcpDate:'')+'</span><button class="btn-sm" onclick="clearHandicaps()" style="font-size:10px;color:#c0392b;border-color:#c0392b">Clear overrides</button></div>'}h+='<textarea id="hdcp-csv" rows="4" placeholder="Paste Squabbit CSV here..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:monospace;resize:vertical;box-sizing:border-box"></textarea>';h+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn-sm btn-apply" onclick="parseAndSaveHandicaps()">Parse & Save</button></div>';h+='<div id="hdcp-msg" style="margin-top:8px"></div>';h+='</div></div>';document.getElementById('admin-panel').innerHTML=h;renderAdminPlayers()}
function renderAdminPlayers(){var ph='';adminPlayers.forEach(function(n,i){ph+='<div class="chip'+(adminSelected[n]?' active':'')+'" id="ap-'+i+'" onclick="toggleAdminPlayer('+i+')">'+n+'</div>'});document.getElementById('admin-player-chips').innerHTML=ph;var c=adminPlayers.filter(function(n){return adminSelected[n]}).length;document.getElementById('admin-player-count').textContent='('+c+' of '+adminPlayers.length+' selected)'}
function toggleAdminDay(d){adminDays[d]=!adminDays[d];document.getElementById('ad-'+d).classList.toggle('active',adminDays[d])}
function toggleAdminPlayer(i){var n=adminPlayers[i];adminSelected[n]=!adminSelected[n];document.getElementById('ap-'+i).classList.toggle('active',adminSelected[n]);var c=adminPlayers.filter(function(n){return adminSelected[n]}).length;document.getElementById('admin-player-count').textContent='('+c+' of '+adminPlayers.length+' selected)'}
function adminSelectAll(){adminPlayers.forEach(function(n,i){adminSelected[n]=true;document.getElementById('ap-'+i).classList.add('active')});document.getElementById('admin-player-count').textContent='('+adminPlayers.length+' of '+adminPlayers.length+' selected)'}
function adminDeselectAll(){adminPlayers.forEach(function(n,i){adminSelected[n]=false;document.getElementById('ap-'+i).classList.remove('active')});document.getElementById('admin-player-count').textContent='(0 of '+adminPlayers.length+' selected)'}
function addNewPlayer(){var input=document.getElementById('new-player-name'),name=input.value.trim();if(!name)return;if(adminPlayers.indexOf(name)!==-1){document.getElementById('admin-msg').innerHTML='<div style="color:#c0392b;font-size:12px">'+name+' is already in the list.</div>';return}adminPlayers.push(name);adminPlayers.sort();adminSelected[name]=true;renderAdminPlayers();input.value='';document.getElementById('admin-msg').innerHTML='<div style="color:var(--green);font-size:12px">Added '+name+'</div>';setTimeout(function(){document.getElementById('admin-msg').innerHTML=''},3000)}
function parseHandicapsFromCSV(text){var lines=text.split('\n');var hdcps={};var current=null;for(var i=0;i<lines.length;i++){var parts=lines[i].split(',');var c0=(parts[0]||'').trim(),c1=(parts[1]||'').trim();if(c0&&c1.toLowerCase().indexOf('tee')!==-1&&parts.length>10){current=c0}if(!c0&&(c1==='Stroke'||c1==='Best Ball')&&current&&!hdcps[current]&&parts.length>2){var raw=(parts[2]||'').trim();if(raw){var val=parseFloat(raw.replace('+',''));if(!isNaN(val)&&val>0)hdcps[current]=val}}}return hdcps}
function parseAndSaveHandicaps(){var csv=document.getElementById('hdcp-csv').value.trim();if(!csv){document.getElementById('hdcp-msg').innerHTML='<div style="color:#c0392b;font-size:12px">Paste a Squabbit CSV first.</div>';return}var hdcps=parseHandicapsFromCSV(csv);var names=Object.keys(hdcps);if(!names.length){document.getElementById('hdcp-msg').innerHTML='<div style="color:#c0392b;font-size:12px">No course handicaps found. Make sure you pasted the full CSV with scorecard data.</div>';return}var today=new Date();var dateStr=(today.getMonth()+1)+'/'+today.getDate()+'/'+today.getFullYear();var days=[];for(var d=0;d<7;d++){if(adminDays[d])days.push(d)}var players=adminPlayers.filter(function(n){return adminSelected[n]});document.getElementById('hdcp-msg').innerHTML='<div style="color:var(--text-muted);font-size:12px">Saving '+names.length+' handicaps...</div>';fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveRingerConfig',season:SEASON,players:players,days:days,hdcps:hdcps,hdcpDate:dateStr})}).then(function(){return fetch(APPS_SCRIPT_URL+'?action=getRingerConfig&season='+SEASON+'&v='+Date.now()).then(function(r){return r.json()})}).then(function(data){if(data&&data.config){ringerConfig=data.config;var preview='<div class="alert-ok" style="margin-bottom:0">✓ Handicaps saved';if(ringerConfig.hdcps){var hList=[];names.sort().forEach(function(n){hList.push(n+': '+hdcps[n])});preview+=' — '+hList.join(', ')}preview+='</div>';document.getElementById('hdcp-msg').innerHTML=preview;document.getElementById('hdcp-csv').value='';computeRinger();buildAdminUI()}else{ringerConfig.hdcps=hdcps;ringerConfig.hdcpDate=dateStr;var hList=[];names.sort().forEach(function(n){hList.push(n+': '+hdcps[n])});document.getElementById('hdcp-msg').innerHTML='<div style="color:#856404;font-size:12px">Could not verify save. Applied locally: '+hList.join(', ')+'</div>';computeRinger()}}).catch(function(e){ringerConfig.hdcps=hdcps;ringerConfig.hdcpDate=dateStr;document.getElementById('hdcp-msg').innerHTML='<div style="color:#856404;font-size:12px">Save may not have persisted ('+e+'). Applied locally for now.</div>';computeRinger()})}
function clearHandicaps(){var days=[];for(var d=0;d<7;d++){if(adminDays[d])days.push(d)}var players=adminPlayers.filter(function(n){return adminSelected[n]});fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'saveRingerConfig',season:SEASON,players:players,days:days})}).then(function(){return fetch(APPS_SCRIPT_URL+'?action=getRingerConfig&season='+SEASON+'&v='+Date.now()).then(function(r){return r.json()})}).then(function(data){if(data&&data.config)ringerConfig=data.config;else{delete ringerConfig.hdcps;delete ringerConfig.hdcpDate}computeRinger();buildAdminUI()}).catch(function(){delete ringerConfig.hdcps;delete ringerConfig.hdcpDate;computeRinger();buildAdminUI()})}
function saveConfig(){var days=[];for(var d=0;d<7;d++){if(adminDays[d])days.push(d)}var players=adminPlayers.filter(function(n){return adminSelected[n]});if(!days.length){document.getElementById('admin-msg').innerHTML='<div style="color:#c0392b;font-size:12px">Select at least one qualifying day.</div>';return}if(!players.length){document.getElementById('admin-msg').innerHTML='<div style="color:#c0392b;font-size:12px">Select at least one player.</div>';return}document.getElementById('admin-msg').innerHTML='<div style="color:var(--text-muted);font-size:12px">Saving...</div>';var configPayload={action:'saveRingerConfig',season:SEASON,players:players,days:days};if(ringerConfig&&ringerConfig.hdcps){configPayload.hdcps=ringerConfig.hdcps;if(ringerConfig.hdcpDate)configPayload.hdcpDate=ringerConfig.hdcpDate}fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(configPayload)}).then(function(){return fetch(APPS_SCRIPT_URL+'?action=getRingerConfig&season='+SEASON+'&v='+Date.now()).then(function(r){return r.json()})}).then(function(data){if(data&&data.config){ringerConfig=data.config;document.getElementById('admin-msg').innerHTML='<div class="alert-ok">✓ Config saved — '+players.length+' players, '+days.map(function(d){return DAY_NAMES[d]}).join(', ')+'</div>';computeRinger()}else{document.getElementById('admin-msg').innerHTML='<div style="color:#856404;font-size:12px">Sent but could not verify. Reload to check.</div>'}}).catch(function(e){document.getElementById('admin-msg').innerHTML='<div style="color:#c0392b;font-size:12px">Save failed: '+e+'</div>'})}
function loadData(){var cp=fetch(APPS_SCRIPT_URL+'?action=getRingerConfig&season='+SEASON+'&v='+Date.now()).then(function(r){return r.json()}).then(function(d){ringerConfig=d.config||null});var dp=fetch(APPS_SCRIPT_URL+'?action=getData&season='+SEASON+'&v='+Date.now()).then(function(r){return r.json()}).then(function(d){allHistory=d.scorecardHistory||[]});Promise.all([cp,dp]).then(function(){computeRinger()}).catch(function(e){document.getElementById('ringer-results').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load data: '+e+'</p></div>'})}
function getDayOfWeek(s){var d=new Date(s);return isNaN(d.getTime())?-1:d.getDay()}
function shortDate(d){var parts=d.split(' ');var months={January:'1',February:'2',March:'3',April:'4',May:'5',June:'6',July:'7',August:'8',September:'9',October:'10',November:'11',December:'12',Jan:'1',Feb:'2',Mar:'3',Apr:'4',Jun:'6',Jul:'7',Aug:'8',Sep:'9',Oct:'10',Nov:'11',Dec:'12'};var m=months[parts[0]]||'?';var day=(parts[1]||'').replace(',','');return m+'/'+day}
function scoreClass(score,holeIdx){var d=score-PAR[holeIdx];if(d<=-2)return 'eagle';if(d===-1)return 'birdie';if(d===1)return 'bogey';if(d>=2)return 'double';return ''}
function renderScoreSpan(score,holeIdx){var cls=scoreClass(score,holeIdx);if(cls)return '<span class="'+cls+'">'+score+'</span>';return ''+score}
function computeRinger(){if(!ringerConfig){document.getElementById('ringer-results').innerHTML='<div class="empty-state"><div class="empty-icon">⚙️</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">Ringer tournament not configured</div><div style="font-size:13px">Click <strong>Admin</strong> above to set up the roster and qualifying days.</div></div>';return}var activeDays={},activePlayers={};(ringerConfig.days||[]).forEach(function(d){activeDays[d]=true});(ringerConfig.players||[]).forEach(function(n){activePlayers[n]=true});var qualifying=allHistory.filter(function(e){return activeDays[getDayOfWeek(e.date)]});var grossBest={},grossSources={},roundCount={},lastHdcp={};playerRoundData={};qualifying.forEach(function(entry){if(!entry.scores)return;Object.keys(entry.scores).forEach(function(name){if(!activePlayers[name])return;var gross=entry.scores[name];if(!gross||gross.length!==18)return;var hdcp=(entry.hdcps&&entry.hdcps[name])?Math.round(entry.hdcps[name]):0;lastHdcp[name]=hdcp;if(!roundCount[name])roundCount[name]=0;roundCount[name]++;if(!playerRoundData[name])playerRoundData[name]=[];playerRoundData[name].push({date:entry.date,gross:gross.slice(),hdcp:hdcp});if(!grossBest[name]){grossBest[name]=gross.slice();grossSources[name]=[];for(var h=0;h<18;h++)grossSources[name].push(entry.date)}else{for(var h=0;h<18;h++){if(gross[h]<grossBest[name][h]){grossBest[name][h]=gross[h];grossSources[name][h]=entry.date}}}})});var grossList=[],netList=[];var holeOrder=[];for(var h=0;h<18;h++)holeOrder.push(h);holeOrder.sort(function(a,b){return SI[a]-SI[b]});(ringerConfig.players||[]).forEach(function(name){if(!grossBest[name])return;var gt=grossBest[name].reduce(function(t,s){return t+s},0);grossList.push({name:name,holes:grossBest[name],total:gt,rounds:roundCount[name]||0,sources:grossSources[name]});var hdcp=(ringerConfig.hdcps&&ringerConfig.hdcps[name])?ringerConfig.hdcps[name]:(HDCP_OVERRIDES[name]!=null?HDCP_OVERRIDES[name]:(lastHdcp[name]||0));var netHoles=[];for(var h=0;h<18;h++){var strokes=0;if(hdcp>=SI[h])strokes++;if(hdcp>=SI[h]+18)strokes++;netHoles.push(grossBest[name][h]-strokes)}var nt=netHoles.reduce(function(t,s){return t+s},0);netList.push({name:name,holes:netHoles,grossHoles:grossBest[name],total:nt,rounds:roundCount[name]||0,hdcp:hdcp,sources:grossSources[name]})});function ringerSort(a,b){if(a.total!==b.total)return a.total-b.total;for(var i=0;i<holeOrder.length;i++){var hi=holeOrder[i];if(a.holes[hi]!==b.holes[hi])return a.holes[hi]-b.holes[hi]}return 0}grossList.sort(ringerSort);netList.sort(ringerSort);var winners=[],used={};function pick(list,label,cls){for(var i=0;i<list.length;i++){if(!used[list[i].name]){winners.push({label:label,name:list[i].name,total:list[i].total,cls:cls,isNet:label.indexOf('Net')!==-1});used[list[i].name]=true;return}}}pick(grossList,'Low Gross','wb-gold');pick(netList,'Low Net','wb-green');pick(grossList,'2nd Low Gross','wb-silver');pick(netList,'2nd Low Net','wb-silver');renderRinger(grossList,netList,winners,qualifying.length)}
function renderRinger(grossList,netList,winners,numRounds){var h='',dayLabels=(ringerConfig.days||[]).map(function(d){return DAY_NAMES[d]}).join(', ');h+='<div class="meta-chips"><div class="meta-chip"><strong>'+(ringerConfig.players||[]).length+'</strong> players</div><div class="meta-chip"><strong>'+numRounds+'</strong> qualifying rounds</div><div class="meta-chip">Qualifying: <strong>'+dayLabels+'</strong></div><div class="meta-chip">Stone Harbor Golf Club · Par '+TOTAL_PAR+'</div></div>';if(numRounds===0){h+='<div class="empty-state"><div class="empty-icon">📋</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">No qualifying rounds yet</div><div style="font-size:13px">Rounds played on '+dayLabels+' will count toward the ringer.</div></div>';document.getElementById('ringer-results').innerHTML=h;return}if(winners.length){h+='<div class="winners">';winners.forEach(function(w){var diff=w.total-TOTAL_PAR;var ds=w.isNet?'':' ('+(diff>0?'+':'')+diff+')';h+='<div class="winner-badge '+w.cls+'"><div class="place">'+w.label+'</div><div class="wname">'+w.name+'</div><div class="wscore">'+w.total+ds+'</div></div>'});h+='</div>'}h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="toggle-bar"><button class="toggle-btn active" id="tog-gross" onclick="showBoard(\'gross\')">Gross Ringer</button><button class="toggle-btn" id="tog-net" onclick="showBoard(\'net\')">Net Ringer</button></div><div style="font-size:11px;color:var(--text-muted)">Tap player → <strong>Audit</strong> tab</div></div>';h+='<div id="board-gross">'+renderBoard(grossList,false)+'</div>';h+='<div id="board-net" style="display:none">'+renderBoard(netList,true)+'</div>';document.getElementById('ringer-results').innerHTML=h}
function showBoard(w){document.getElementById('board-gross').style.display=w==='gross'?'block':'none';document.getElementById('board-net').style.display=w==='net'?'block':'none';document.getElementById('tog-gross').classList.toggle('active',w==='gross');document.getElementById('tog-net').classList.toggle('active',w==='net')}
function renderBoard(list,isNet){var prefix=isNet?'net':'gross',allNames=(ringerConfig?ringerConfig.players:[])||[];var colClass=isNet?'cols-net':'cols-gross';var h='<div class="lb-card"><div class="card-header"><span>'+(isNet?'Net':'Gross')+' Ringer Leaderboard</span>';if(isNet)h+='<span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted)">Current handicap applied to gross best card</span>';h+='</div>';h+='<div class="lb-row lb-head '+colClass+'">';h+='<div class="lb-cell">#</div><div class="lb-cell">Player</div>';if(isNet)h+='<div class="lb-cell num hide-sm">Hdcp</div>';h+='<div class="lb-cell num">Front</div><div class="lb-cell num">Back</div><div class="lb-cell num">Total</div><div class="lb-cell num hide-sm">Rnds</div>';h+='</div>';list.forEach(function(p,i){var rank=i+1,rkC=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';var avC='av'+(allNames.indexOf(p.name)%10);var front=p.holes.slice(0,9).reduce(function(t,s){return t+s},0),back=p.holes.slice(9).reduce(function(t,s){return t+s},0);var diff=p.total-TOTAL_PAR,dC=diff<0?'pos':diff>0?'neg':'neu';var dS=isNet?'':' <span style="font-size:10px;color:var(--text-muted)">('+(diff>0?'+':'')+diff+')</span>';var sid=prefix+'-'+p.name.replace(/[^a-zA-Z0-9]/g,'_');h+='<div class="lb-row lb-data '+colClass+'" onclick="togglePanel(\''+sid+'\')">';h+='<div class="lb-cell rank '+rkC+'">'+rank+'</div>';h+='<div class="lb-cell"><div class="player-cell"><div class="avatar '+avC+'">'+initials(p.name)+'</div><span class="player-name">'+p.name+'</span> <span style="font-size:10px;color:var(--text-muted)">▾</span></div></div>';if(isNet)h+='<div class="lb-cell num hide-sm" style="font-size:12px;color:var(--text-muted)">'+p.hdcp+'</div>';h+='<div class="lb-cell num">'+front+'</div><div class="lb-cell num">'+back+'</div>';h+='<div class="lb-cell num"><span class="'+dC+'" style="font-weight:700">'+p.total+'</span>'+dS+'</div>';h+='<div class="lb-cell num hide-sm">'+p.rounds+'</div>';h+='</div>';h+='<div class="detail-panel" id="'+sid+'">';h+='<div class="audit-tabs">';h+='<button class="audit-tab active" id="'+sid+'-tab-best" onclick="showAuditTab(\''+sid+'\',\'best\')">Best Card</button>';h+='<button class="audit-tab" id="'+sid+'-tab-audit" onclick="showAuditTab(\''+sid+'\',\'audit\')">📋 Round-by-Round Audit</button>';h+='</div>';h+='<div class="audit-content" id="'+sid+'-best">'+renderHoleCard(p,isNet)+'</div>';h+='<div class="audit-content" id="'+sid+'-audit" style="display:none">'+renderAudit(p,isNet)+'</div>';h+='</div>'});h+='</div>';return h}
function togglePanel(id){var el=document.getElementById(id);if(el)el.classList.toggle('open')}
function showAuditTab(sid,tab){document.getElementById(sid+'-best').style.display=tab==='best'?'block':'none';document.getElementById(sid+'-audit').style.display=tab==='audit'?'block':'none';document.getElementById(sid+'-tab-best').classList.toggle('active',tab==='best');document.getElementById(sid+'-tab-audit').classList.toggle('active',tab==='audit')}
function renderHoleCard(p,isNet){var name=p.name,holes=p.holes,sources=p.sources||[];var h='<div class="bc-title">'+name+' — '+(isNet?'Net':'Gross')+' Best Card</div><div class="bc-wrap"><table class="sc"><thead><tr><th class="lbl"></th>';for(var n=1;n<=9;n++)h+='<th>'+n+'</th>';h+='<th style="background:#e8e8e0">Out</th>';for(var n=10;n<=18;n++)h+='<th>'+n+'</th>';h+='<th style="background:#e8e8e0">In</th><th style="background:#e8e8e0">Tot</th></tr></thead><tbody>';if(!isNet){h+='<tr><td class="lbl">Par</td>';var fp=0,bp=0;for(var i=0;i<9;i++){h+='<td style="color:var(--text-muted);font-weight:400">'+PAR[i]+'</td>';fp+=PAR[i]}h+='<td class="sub">'+fp+'</td>';for(var i=9;i<18;i++){h+='<td style="color:var(--text-muted);font-weight:400">'+PAR[i]+'</td>';bp+=PAR[i]}h+='<td class="sub">'+bp+'</td><td class="sub">'+(fp+bp)+'</td></tr>'}if(isNet&&p.grossHoles){h+='<tr><td class="lbl">Gross</td>';var gF=0,gB=0;for(var i=0;i<18;i++){var s=p.grossHoles[i];h+='<td>'+renderScoreSpan(s,i)+'<span class="source-tag">'+shortDate(sources[i]||'')+'</span></td>';if(i<9)gF+=s;else gB+=s;if(i===8)h+='<td class="sub">'+gF+'</td>'}h+='<td class="sub">'+gB+'</td><td class="sub">'+(gF+gB)+'</td></tr>';var hdcp=p.hdcp||0;h+='<tr><td class="lbl">Strokes ('+hdcp+')</td>';var sF=0,sB=0;for(var i=0;i<18;i++){var st=0;if(hdcp>=SI[i])st++;if(hdcp>=SI[i]+18)st++;h+='<td style="color:var(--green-accent);font-size:11px">'+(st?'-'+st:'')+'</td>';if(i<9)sF+=st;else sB+=st;if(i===8)h+='<td class="sub" style="font-size:10px;color:var(--green-accent)">-'+sF+'</td>'}h+='<td class="sub" style="font-size:10px;color:var(--green-accent)">-'+sB+'</td><td class="sub" style="font-size:10px;color:var(--green-accent)">-'+(sF+sB)+'</td></tr>'}h+='<tr><td class="lbl">'+(isNet?'Net':'Best')+'</td>';var fS=0,bS=0;for(var i=0;i<18;i++){var s=holes[i],d=s-PAR[i],c='';if(!isNet){if(d<=-2)c='eagle';else if(d===-1)c='birdie';else if(d===1)c='bogey';else if(d>=2)c='double'}var ct=(c)?'<span class="'+c+'">'+s+'</span>':''+s;var srcTag=(!isNet&&sources[i])?'<span class="source-tag">'+shortDate(sources[i])+'</span>':'';h+='<td>'+ct+srcTag+'</td>';if(i<9)fS+=s;else bS+=s;if(i===8)h+='<td class="sub">'+fS+'</td>'}h+='<td class="sub">'+bS+'</td><td class="sub">'+(fS+bS)+'</td></tr></tbody></table></div>';return h}
function renderAudit(p,isNet){var name=p.name;var rounds=playerRoundData[name]||[];if(!rounds.length)return '<div style="padding:20px;text-align:center;color:var(--text-muted)">No round data available</div>';var bestSources=p.sources||[];var grossHoles=isNet&&p.grossHoles?p.grossHoles:p.holes;var h='';h+='<div class="audit-legend">';h+='<div class="audit-legend-item"><div class="audit-legend-swatch" style="background:#d4edda;box-shadow:inset 0 0 0 1.5px var(--green-accent)"></div> Best score used in ringer card</div>';h+='<div class="audit-legend-item" style="margin-left:auto;font-style:italic">Match green cells to your paper cards</div>';h+='</div>';h+='<div class="bc-wrap" style="padding:0"><table class="audit">';h+='<thead><tr><th style="text-align:left;padding-left:8px;min-width:80px">Round</th>';for(var n=1;n<=9;n++)h+='<th>'+n+'</th>';h+='<th style="background:#e8e8e0">Out</th>';for(var n=10;n<=18;n++)h+='<th>'+n+'</th>';h+='<th style="background:#e8e8e0">In</th><th style="background:#e8e8e0">Tot</th></tr>';h+='<tr><td class="lbl" style="color:var(--text-muted);font-weight:400;font-size:10px">Par</td>';var fp=0,bp=0;for(var i=0;i<9;i++){h+='<td class="par-row">'+PAR[i]+'</td>';fp+=PAR[i]}h+='<td class="sub" style="font-size:10px;color:var(--text-muted)">'+fp+'</td>';for(var i=9;i<18;i++){h+='<td class="par-row">'+PAR[i]+'</td>';bp+=PAR[i]}h+='<td class="sub" style="font-size:10px;color:var(--text-muted)">'+bp+'</td><td class="sub" style="font-size:10px;color:var(--text-muted)">'+(fp+bp)+'</td>';h+='</tr></thead><tbody>';rounds.forEach(function(round){var scores=round.gross;if(!scores)return;var front=0,back=0;var hdcpLabel=isNet?' <span style="font-size:9px;color:var(--text-muted)">('+round.hdcp+')</span>':'';h+='<tr><td class="lbl">'+round.date+hdcpLabel+'</td>';for(var i=0;i<18;i++){var s=scores[i];var isBest=(s===grossHoles[i]&&bestSources[i]===round.date);h+='<td'+(isBest?' class="best-hole"':'')+'>'+renderScoreSpan(s,i)+'</td>';if(i<9)front+=s;else back+=s;if(i===8)h+='<td class="sub">'+front+'</td>'}h+='<td class="sub">'+back+'</td><td class="sub">'+(front+back)+'</td></tr>'});h+='<tr style="border-top:2px solid var(--green-accent);background:var(--green-light)">';h+='<td class="lbl" style="color:var(--green);font-weight:700">RINGER</td>';var rF=0,rB=0;for(var i=0;i<18;i++){var s=grossHoles[i];h+='<td style="font-weight:700;color:var(--green)">'+renderScoreSpan(s,i)+'</td>';if(i<9)rF+=s;else rB+=s;if(i===8)h+='<td class="sub" style="color:var(--green);font-weight:700">'+rF+'</td>'}h+='<td class="sub" style="color:var(--green);font-weight:700">'+rB+'</td>';h+='<td class="sub" style="color:var(--green);font-weight:700">'+(rF+rB)+'</td></tr>';if(isNet){var hdcp=p.hdcp||0;h+='<tr style="background:#e8f5e9">';h+='<td class="lbl" style="color:var(--green);font-weight:700;font-size:10px">NET ('+hdcp+')</td>';var nF=0,nB=0;for(var i=0;i<18;i++){var s=p.holes[i];h+='<td style="font-weight:700;color:var(--green);font-size:11px">'+s+'</td>';if(i<9)nF+=s;else nB+=s;if(i===8)h+='<td class="sub" style="color:var(--green);font-weight:700;font-size:11px">'+nF+'</td>'}h+='<td class="sub" style="color:var(--green);font-weight:700;font-size:11px">'+nB+'</td>';h+='<td class="sub" style="color:var(--green);font-weight:700;font-size:11px">'+(nF+nB)+'</td></tr>'}h+='</tbody></table></div>';return h}
loadData();
